name: ${COMPOSE_PROJECT_NAME:-personal-platform}

services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-personal_platform}
      POSTGRES_USER: ${POSTGRES_USER:-personal_platform}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-for-local-development}
    # Not published to the host by default (FP-7.4): only containers on the
    # compose network reach the database. Use docker/compose.expose.yml to
    # publish it for local tooling.
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    environment:
      HOST: 0.0.0.0
      PORT: 8000
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      PLATFORM_ROOT: /workspace
      DATABASE_URL: postgresql://${POSTGRES_USER:-personal_platform}:${POSTGRES_PASSWORD:-change-me-for-local-development}@database:5432/${POSTGRES_DB:-personal_platform}
    # Not published to the host by default: the frontend proxy is the only
    # intended entry point. Use docker/compose.expose.yml for API debugging.
    volumes:
      - ./backend:/workspace/backend
      - ./apps:/workspace/apps
      - ./config:/workspace/config
      - ./migrations:/workspace/migrations
      - ./storage:/workspace/storage
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8000/api/core/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    environment:
      VITE_API_PROXY_TARGET: http://backend:8000
    # Loopback-only by default (FP-7.4). Set BIND_IP=0.0.0.0 (or a specific
    # interface address) in the environment to expose the UI on the LAN.
    ports:
      - "${BIND_IP:-127.0.0.1}:${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/workspace/frontend
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5173').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

volumes:
  postgres-data:

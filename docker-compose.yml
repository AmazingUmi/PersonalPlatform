name: ${COMPOSE_PROJECT_NAME:-personal-platform}

services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-personal_platform}
      POSTGRES_USER: ${POSTGRES_USER:-personal_platform}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-for-local-development}
    # Not published to the host by default (FP-7.4): only containers on the
    # compose network reach the database. Use docker/compose.expose.yml to
    # publish it for local tooling.
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    environment:
      HOST: 0.0.0.0
      PORT: 8000
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      PLATFORM_ROOT: /workspace
      DATABASE_URL: postgresql://${POSTGRES_USER:-personal_platform}:${POSTGRES_PASSWORD:-change-me-for-local-development}@database:5432/${POSTGRES_DB:-personal_platform}
      # Runtime environment / cookie hardening (AUTH-H1-02): production sets
      # the Secure attribute on the pp_session cookie (behind HTTPS).
      PLATFORM_ENVIRONMENT: ${PLATFORM_ENVIRONMENT:-development}
      # Explicit Secure override (wins over PLATFORM_ENVIRONMENT). Empty = off.
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-}
      # Trusted reverse proxy (AUTH-H1-03): only under this configuration is
      # X-Forwarded-For honored for the login limiter. Empty = do not trust.
      # `uniquelocal` matches the compose network (172.16.0.0/12).
      TRUST_PROXY: ${TRUST_PROXY:-}
      # First-admin bootstrap (empty = skip; see README "身份认证" / .env.example).
      # Passed through so `docker compose` can activate the placeholder admin
      # on first boot. Never resets an already-activated password; once an
      # active admin exists this is a noop (AUTH-H1-05).
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
    # Not published to the host by default: the frontend proxy is the only
    # intended entry point. Use docker/compose.expose.yml for API debugging.
    volumes:
      - ./backend:/workspace/backend
      - ./apps:/workspace/apps
      - ./config:/workspace/config
      - ./migrations:/workspace/migrations
      - ./storage:/workspace/storage
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8000/api/core/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    environment:
      VITE_API_PROXY_TARGET: http://backend:8000
    # Loopback-only by default (FP-7.4). Set BIND_IP=0.0.0.0 (or a specific
    # interface address) in the environment to expose the UI on the LAN.
    ports:
      - "${BIND_IP:-127.0.0.1}:${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/workspace/frontend
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5173').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

volumes:
  postgres-data:

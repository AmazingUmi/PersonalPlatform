# Standalone source-build production deployment; do not merge with development.
name: ${COMPOSE_PROJECT_NAME:-personal-platform-production}

services:
  database:
    extends:
      file: docker-compose.runtime.yml
      service: database
  backend:
    extends:
      file: docker-compose.runtime.yml
      service: backend
    build:
      context: ..
      dockerfile: docker/backend.prod.Dockerfile
  frontend:
    extends:
      file: docker-compose.runtime.yml
      service: frontend
    build:
      context: ..
      dockerfile: docker/frontend.prod.Dockerfile

volumes:
  postgres-data:
  app-storage:

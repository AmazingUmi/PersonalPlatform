server {
    listen 8080 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Resolve the service on requests so backend container replacement does
    # not leave the proxy pinned to an old Docker-network IP.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:8000;

    # The API accepts attachments up to 10 MiB; allow multipart overhead.
    client_max_body_size 12m;

    location ~ ^/api(?:/|$) {
        proxy_pass $backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # App IDs cannot start with an underscore, so compiled assets never
    # collide with a real SPA route such as /assets/items/:id.
    location /_static/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /index.html {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

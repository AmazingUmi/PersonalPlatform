name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check-build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: personal_platform_test
          POSTGRES_USER: personal_platform
          POSTGRES_PASSWORD: change-me-for-local-development
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U personal_platform -d personal_platform_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://personal_platform:change-me-for-local-development@127.0.0.1:5432/personal_platform_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # The backup/restore integration test shells out to pg_dump/psql; the
      # client major must match the postgres:17 service.
      - name: Install PostgreSQL 17 client tools
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] http://apt.postgresql.org/pub/repos/apt $(. /etc/os-release && echo "$VERSION_CODENAME")-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client-17
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm test
      - run: npm run test:integration
      - name: Dependency security scan
        run: npm audit --audit-level=high
      - name: Create E2E database
        run: |
          node -e '
            const { Client } = require("pg");
            const c = new Client({ connectionString: process.env.PG_ADMIN });
            (async () => {
              await c.connect();
              await c.query("CREATE DATABASE personal_platform_e2e");
              await c.end();
            })().catch((e) => {
              if (!/already exists/.test(String(e.message))) { console.error(e); process.exit(1); }
            });
          '
        env:
          PG_ADMIN: postgresql://personal_platform:change-me-for-local-development@127.0.0.1:5432/postgres
      - name: E2E (Playwright, system Chrome)
        run: npm run e2e
        env:
          E2E_DATABASE_URL: postgresql://personal_platform:change-me-for-local-development@127.0.0.1:5432/personal_platform_e2e
